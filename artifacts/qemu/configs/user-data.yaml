# BUILD-TIME cloud-init config.
# Used only during Ansible provisioning (build_qemu_root.sh).
# At runtime the QEMU container's startup.sh generates a dynamic
# user-data.yaml that injects access-token auth, SSH keys, UID
# remapping, and other IDEKUBE_* settings via write_files / runcmd.
#
# ssh_pwauth is true here because Ansible connects via sshpass
# during build.  The runtime config sets ssh_pwauth: false and
# vm-init.sh enforces PasswordAuthentication no in sshd_config.

#cloud-config
users:
  - name: idekube
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    groups: [sudo, video]

chpasswd:
  list: |
    idekube:idekube
  expire: False

# Allow password auth during build (Ansible provisioning)
ssh_pwauth: true

timezone: Asia/Shanghai

network:
  version: 2
  ethernets:
    eth0:
      dhcp4: true
      dhcp6: false