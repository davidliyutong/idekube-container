<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>IDEKube Container</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            :root {
                --primary: #2b7a8b;
                --primary-light: #3a9daf;
                --primary-dark: #1f5a68;
                --accent: #5ac8d8;
                --bg-primary: #ffffff;
                --bg-secondary: #f8fafb;
                --bg-card: #ffffff;
                --text-primary: #0f172a;
                --text-secondary: #475569;
                --text-tertiary: #94a3b8;
                --border: #e2e8f0;
                --shadow: rgba(0, 0, 0, 0.08);
                --shadow-hover: rgba(0, 0, 0, 0.12);
            }

            [data-theme="dark"] {
                --primary: #3a9daf;
                --primary-light: #5ac8d8;
                --primary-dark: #2b7a8b;
                --accent: #5ac8d8;
                --bg-primary: #0f172a;
                --bg-secondary: #1e293b;
                --bg-card: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #cbd5e1;
                --text-tertiary: #64748b;
                --border: #334155;
                --shadow: rgba(0, 0, 0, 0.3);
                --shadow-hover: rgba(0, 0, 0, 0.5);
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
                background: var(--bg-primary);
                background-image: radial-gradient(circle at 20% 50%, var(--primary) 0%, transparent 50%), radial-gradient(circle at 80% 80%, var(--accent) 0%, transparent 50%);
                background-attachment: fixed;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                transition: background 0.3s ease;
                color: var(--text-primary);
            }

            .controls {
                position: fixed;
                top: 24px;
                right: 24px;
                display: flex;
                gap: 12px;
                z-index: 100;
            }

            .control-button {
                width: 48px;
                height: 48px;
                border-radius: 50%;
                background: var(--bg-card);
                border: 1px solid var(--border);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.5rem;
                box-shadow: 0 4px 12px var(--shadow);
                transition: all 0.3s ease;
            }

            .control-button:hover {
                transform: scale(1.05);
                box-shadow: 0 6px 20px var(--shadow-hover);
            }

            .lang-toggle {
                font-size: 1rem;
                font-weight: 600;
                color: var(--text-primary);
            }

            .container {
                background: var(--bg-card);
                backdrop-filter: blur(10px);
                border-radius: 24px;
                border: 1px solid var(--border);
                box-shadow: 0 24px 48px var(--shadow);
                padding: 64px;
                max-width: 700px;
                width: 100%;
                transition: all 0.3s ease;
            }

            .logo-section {
                text-align: center;
                margin-bottom: 48px;
            }

            .logo {
                display: inline-block;
                font-size: 4rem;
                font-weight: 700;
                letter-spacing: -0.02em;
                background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                margin-bottom: 16px;
            }

            .logo-text {
                font-size: 3rem;
                font-weight: 700;
                letter-spacing: -0.02em;
                color: var(--text-primary);
                margin: 0;
            }

            .subtitle {
                color: var(--text-secondary);
                font-size: 1.125rem;
                font-weight: 400;
                margin-top: 12px;
            }

            .services {
                display: grid;
                gap: 12px;
                margin-bottom: 40px;
            }

            .service-card {
                display: flex;
                align-items: center;
                padding: 20px 24px;
                background: var(--bg-secondary);
                border: 1px solid var(--border);
                border-radius: 16px;
                text-decoration: none;
                color: inherit;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                cursor: pointer;
                position: relative;
                overflow: hidden;
            }

            .service-card::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 4px;
                height: 100%;
                background: linear-gradient(135deg, var(--primary), var(--accent));
                transform: scaleY(0);
                transition: transform 0.3s ease;
            }

            .service-card:hover {
                transform: translateX(4px);
                box-shadow: 0 12px 24px var(--shadow-hover);
                border-color: var(--primary);
            }

            .service-card:hover::before {
                transform: scaleY(1);
            }

            .service-icon-wrapper {
                font-size: 2rem;
                margin-right: 20px;
                filter: grayscale(0.3);
                transition: all 0.3s ease;
            }

            .service-card:hover .service-icon-wrapper {
                filter: grayscale(0);
                transform: scale(1.1);
            }

            .service-content {
                flex: 1;
            }

            .service-name {
                font-size: 1.25rem;
                font-weight: 600;
                color: var(--text-primary);
                margin-bottom: 4px;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .service-status {
                display: inline-block;
                width: 8px;
                height: 8px;
                background: var(--accent);
                border-radius: 50%;
                animation: pulse 2s ease-in-out infinite;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
            }

            .service-description {
                font-size: 0.875rem;
                color: var(--text-tertiary);
                font-weight: 400;
            }

            .service-arrow {
                color: var(--text-tertiary);
                font-size: 1.25rem;
                transition: all 0.3s ease;
                opacity: 0;
            }

            .service-card:hover .service-arrow {
                opacity: 1;
                transform: translateX(4px);
            }

            .footer {
                text-align: center;
                color: var(--text-tertiary);
                font-size: 0.875rem;
                font-weight: 400;
                padding-top: 24px;
                border-top: 1px solid var(--border);
            }

            .loading {
                text-align: center;
                color: var(--text-secondary);
                padding: 40px;
            }

            .loading::after {
                content: "...";
                animation: dots 1.5s steps(4, end) infinite;
            }

            @keyframes dots {
                0%,
                20% {
                    content: ".";
                }
                40% {
                    content: "..";
                }
                60%,
                100% {
                    content: "...";
                }
            }

            @media (max-width: 768px) {
                .container {
                    padding: 40px 32px;
                }

                .logo-text {
                    font-size: 2.5rem;
                }

                .controls {
                    top: 16px;
                    right: 16px;
                }

                .control-button {
                    width: 44px;
                    height: 44px;
                }
            }

            @media (max-width: 480px) {
                body {
                    padding: 16px;
                }

                .container {
                    padding: 32px 24px;
                }

                .logo-text {
                    font-size: 2rem;
                }

                .subtitle {
                    font-size: 1rem;
                }

                .service-card {
                    padding: 16px 20px;
                }

                .service-icon-wrapper {
                    font-size: 1.5rem;
                    margin-right: 16px;
                }

                .service-name {
                    font-size: 1.125rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="controls">
            <button class="control-button lang-toggle" id="langToggle" aria-label="Toggle language">EN</button>
            <button class="control-button" id="themeToggle" aria-label="Toggle theme">🌙</button>
        </div>

        <div class="container">
            <div class="logo-section">
                <h1 class="logo-text">IDEKube</h1>
                <p class="subtitle" data-i18n="subtitle">选择一个服务开始使用</p>
            </div>

            <div class="services" id="services">
                <div class="loading" data-i18n="loading">正在检测可用服务</div>
            </div>

            <div class="footer">
                <p data-i18n="footer">IDEKube Container Environment</p>
            </div>
        </div>

        <script>
            // Language translations
            const translations = {
                en: {
                    subtitle: "Select a service to get started",
                    loading: "Detecting available services",
                    noServices: "No services available",
                    footer: "IDEKube Container Environment",
                    services: {
                        vnc: {
                            name: "Desktop",
                            description: "Remote desktop via noVNC",
                        },
                        coder: {
                            name: "Code Server",
                            description: "VS Code in the browser",
                        },
                        jupyter: {
                            name: "Jupyter Lab",
                            description: "Interactive notebook environment",
                        },
                        ssh: {
                            name: "SSH Terminal",
                            description: "Click to copy SSH ProxyCommand configuration",
                            action: "copy-ssh",
                        },
                        agent: {
                            name: "Agent Gateway",
                            description: "openclaw-backed agent API and web UI",
                        },
                    },
                },
                zh: {
                    subtitle: "选择一个服务开始使用",
                    loading: "正在检测可用服务",
                    noServices: "暂无可用服务",
                    footer: "IDEKube 容器环境",
                    services: {
                        vnc: {
                            name: "桌面环境",
                            description: "通过 noVNC 访问远程桌面",
                        },
                        coder: {
                            name: "代码编辑器",
                            description: "浏览器中的 VS Code 编辑器",
                        },
                        jupyter: {
                            name: "Jupyter Lab",
                            description: "交互式笔记本环境",
                        },
                        ssh: {
                            name: "SSH 终端",
                            description: "点击复制 SSH ProxyCommand 配置",
                            action: "copy-ssh",
                        },
                        agent: {
                            name: "Agent 网关",
                            description: "openclaw 驱动的 Agent API 与 Web UI",
                        },
                    },
                },
            };

            // Language management
            const langToggle = document.getElementById("langToggle");
            let currentLang = localStorage.getItem("language") || "zh";

            function setLanguage(lang) {
                currentLang = lang;
                localStorage.setItem("language", lang);
                langToggle.textContent = lang === "zh" ? "EN" : "中";

                // Update static text elements
                document.querySelectorAll("[data-i18n]").forEach((element) => {
                    const key = element.getAttribute("data-i18n");
                    if (translations[lang][key]) {
                        element.textContent = translations[lang][key];
                    }
                });

                // Re-render services if they're already loaded
                // We re-detect to ensure correct objects are built with new language
                detectServices().then(renderServices);
            }

            setLanguage(currentLang);

            langToggle.addEventListener("click", () => {
                const newLang = currentLang === "zh" ? "en" : "zh";
                setLanguage(newLang);
            });

            // Theme management
            const themeToggle = document.getElementById("themeToggle");
            const html = document.documentElement;

            // Load saved theme or use system preference
            const savedTheme = localStorage.getItem("theme");
            const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const initialTheme = savedTheme || (systemPrefersDark ? "dark" : "light");

            function setTheme(theme) {
                html.setAttribute("data-theme", theme);
                themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
                localStorage.setItem("theme", theme);
            }

            setTheme(initialTheme);

            themeToggle.addEventListener("click", () => {
                const currentTheme = html.getAttribute("data-theme");
                const newTheme = currentTheme === "dark" ? "light" : "dark";
                setTheme(newTheme);
            });

            // Define available services based on container type
            const serviceConfig = {
                vnc: {
                    icon: "🖥️",
                },
                coder: {
                    icon: "💻",
                },
                jupyter: {
                    icon: "📊",
                },
                ssh: {
                    icon: "⌨️",
                },
                agent: {
                    icon: "🤖",
                },
            };

            // Detect available services by checking endpoints
            async function detectServices() {
                const services = [];
                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                const host = window.location.host;

                for (const [path, config] of Object.entries(serviceConfig)) {
                    try {
                        let available = false;
                        if (path === "ssh") {
                            // Test WebSocket connection for SSH
                            // We create a promise that rejects on error/close and resolves on open
                            available = await new Promise((resolve) => {
                                const socket = new WebSocket(`${protocol}//${host}/${path}/`);
                                socket.onopen = () => {
                                    socket.close();
                                    resolve(true);
                                };
                                socket.onerror = () => {
                                    resolve(false);
                                };
                            });
                        } else {
                            // Use GET for other services to avoid 405 Method Not Allowed
                            const response = await fetch(`/${path}/`, { method: "GET" });
                            if (response.ok || response.status === 401 || response.status === 403) {
                                available = true;
                            }
                        }

                        if (available) {
                            // Get base config and translation
                            const serviceTranslation = translations[currentLang].services[path] || {};

                            services.push({
                                path,
                                ...config,
                                ...serviceTranslation,
                            });
                        }
                    } catch (e) {
                        console.error(`Error detecting ${path}:`, e);
                        // Service not available
                    }
                }

                return services;
            }

            // Render services
            function renderServices(services) {
                const container = document.getElementById("services");

                if (!services || services.length === 0) {
                    container.innerHTML = `<p class="loading">${translations[currentLang].noServices}</p>`;
                    return;
                }

                container.innerHTML = services
                    .map((service) => {
                        // Determine if this is a link or a button action
                        const isCopyAction = service.action === "copy-ssh";
                        const href = isCopyAction ? "javascript:void(0)" : `/${service.path}/`;
                        const onClick = isCopyAction ? `onclick="copySSHCommand('${service.path}')"` : "";
                        const arrow = isCopyAction ? "📋" : "→";

                        return `
                        <a href="${href}" ${onClick} class="service-card" id="service-${service.path}">
                            <div class="service-icon-wrapper">${service.icon}</div>
                            <div class="service-content">
                                <div class="service-name">
                                    <span class="service-status"></span>
                                    ${service.name}
                                </div>
                                <div class="service-description">${service.description}</div>
                            </div>
                            <div class="service-arrow">${arrow}</div>
                        </a>
                    `;
                    })
                    .join("");
            }

            function copySSHCommand(path) {
                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                const host = window.location.host;
                const hostname = window.location.hostname;
                const wsUrl = `${protocol}//${host}/${path}/`;

                const command = `Host ${hostname}
    ProxyCommand websocat --binary ${wsUrl}
    User idekube`;

                navigator.clipboard
                    .writeText(command)
                    .then(() => {
                        const originalText = translations[currentLang].services.ssh.description;
                        const card = document.querySelector("#service-ssh .service-description");
                        const originalColor = card.style.color;

                        card.textContent = currentLang === "zh" ? "已复制 ProxyCommand!" : "ProxyCommand Copied!";
                        card.style.color = "var(--primary)";

                        setTimeout(() => {
                            card.textContent = originalText;
                            card.style.color = originalColor;
                        }, 2000);
                    })
                    .catch((err) => {
                        console.error("Failed to copy text: ", err);
                    });
            }

            // Initialize
            detectServices().then(renderServices);

            // Clean URL query params
            if (window.location.search) {
                const url = new URL(window.location.href);
                url.search = "";
                window.history.replaceState({}, document.title, url.toString());
            }
        </script>
    </body>
</html>
