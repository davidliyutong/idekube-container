<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>IDEKube - Access Token Required</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            :root {
                --primary: #2b7a8b;
                --primary-light: #3a9daf;
                --primary-dark: #1f5a68;
                --accent: #5ac8d8;
                --bg-primary: #ffffff;
                --bg-secondary: #f8fafb;
                --bg-card: #ffffff;
                --text-primary: #0f172a;
                --text-secondary: #475569;
                --text-tertiary: #94a3b8;
                --border: #e2e8f0;
                --shadow: rgba(0, 0, 0, 0.08);
                --shadow-hover: rgba(0, 0, 0, 0.12);
            }

            [data-theme="dark"] {
                --primary: #3a9daf;
                --primary-light: #5ac8d8;
                --primary-dark: #2b7a8b;
                --accent: #5ac8d8;
                --bg-primary: #0f172a;
                --bg-secondary: #1e293b;
                --bg-card: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #cbd5e1;
                --text-tertiary: #64748b;
                --border: #334155;
                --shadow: rgba(0, 0, 0, 0.3);
                --shadow-hover: rgba(0, 0, 0, 0.5);
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
                background: var(--bg-primary);
                background-image: radial-gradient(circle at 20% 50%, var(--primary) 0%, transparent 50%), radial-gradient(circle at 80% 80%, var(--accent) 0%, transparent 50%);
                background-attachment: fixed;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                transition: background 0.3s ease;
                color: var(--text-primary);
            }

            .controls {
                position: fixed;
                top: 24px;
                right: 24px;
                display: flex;
                gap: 12px;
                z-index: 100;
            }

            .control-button {
                width: 48px;
                height: 48px;
                border-radius: 50%;
                background: var(--bg-card);
                border: 1px solid var(--border);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.5rem;
                box-shadow: 0 4px 12px var(--shadow);
                transition: all 0.3s ease;
            }

            .control-button:hover {
                transform: scale(1.05);
                box-shadow: 0 6px 20px var(--shadow-hover);
            }

            .lang-toggle {
                font-size: 1rem;
                font-weight: 600;
                color: var(--text-primary);
            }

            .container {
                background: var(--bg-card);
                backdrop-filter: blur(10px);
                border-radius: 24px;
                border: 1px solid var(--border);
                box-shadow: 0 24px 48px var(--shadow);
                padding: 64px;
                max-width: 500px;
                width: 100%;
                transition: all 0.3s ease;
                text-align: center;
            }

            .lock-icon {
                font-size: 4rem;
                margin-bottom: 24px;
                display: inline-block;
            }

            .title {
                font-size: 1.75rem;
                font-weight: 700;
                color: var(--text-primary);
                margin-bottom: 12px;
            }

            .description {
                color: var(--text-secondary);
                font-size: 1rem;
                margin-bottom: 36px;
                line-height: 1.6;
            }

            .token-form {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .token-input {
                width: 100%;
                padding: 16px 20px;
                border: 2px solid var(--border);
                border-radius: 12px;
                font-size: 1rem;
                font-family: inherit;
                background: var(--bg-secondary);
                color: var(--text-primary);
                outline: none;
                transition: all 0.3s ease;
                text-align: center;
                letter-spacing: 0.05em;
            }

            .token-input::placeholder {
                color: var(--text-tertiary);
                letter-spacing: normal;
            }

            .token-input:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 4px rgba(43, 122, 139, 0.15);
            }

            .submit-button {
                width: 100%;
                padding: 16px 24px;
                background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
                color: #ffffff;
                border: none;
                border-radius: 12px;
                font-size: 1.05rem;
                font-weight: 600;
                font-family: inherit;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .submit-button:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 24px rgba(43, 122, 139, 0.3);
            }

            .submit-button:active {
                transform: translateY(0);
            }

            .error-message {
                color: #ef4444;
                font-size: 0.875rem;
                margin-top: 4px;
                display: none;
            }

            .footer {
                color: var(--text-tertiary);
                font-size: 0.875rem;
                margin-top: 32px;
                padding-top: 24px;
                border-top: 1px solid var(--border);
            }

            @media (max-width: 768px) {
                .container {
                    padding: 40px 32px;
                }
                .controls {
                    top: 16px;
                    right: 16px;
                }
                .control-button {
                    width: 44px;
                    height: 44px;
                }
            }

            @media (max-width: 480px) {
                body {
                    padding: 16px;
                }
                .container {
                    padding: 32px 24px;
                }
                .title {
                    font-size: 1.5rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="controls">
            <button class="control-button lang-toggle" id="langToggle" aria-label="Toggle language">EN</button>
            <button class="control-button" id="themeToggle" aria-label="Toggle theme">🌙</button>
        </div>

        <div class="container">
            <div class="lock-icon">🔒</div>
            <h1 class="title" data-i18n="title">需要访问令牌</h1>
            <p class="description" data-i18n="description">此容器环境需要访问令牌才能使用。请输入您的访问令牌以继续。</p>

            <form class="token-form" id="tokenForm">
                <input
                    type="password"
                    class="token-input"
                    id="tokenInput"
                    data-i18n-placeholder="placeholder"
                    placeholder="请输入访问令牌"
                    autocomplete="off"
                    autofocus
                />
                <p class="error-message" id="errorMessage" data-i18n="error">请输入访问令牌</p>
                <button type="submit" class="submit-button" data-i18n="submit">验证</button>
            </form>

            <div class="footer">
                <p data-i18n="footer">IDEKube Container Environment</p>
            </div>
        </div>

        <script>
            const translations = {
                en: {
                    title: "Access Token Required",
                    description: "This container environment requires an access token. Please enter your token to continue.",
                    placeholder: "Enter access token",
                    submit: "Authenticate",
                    error: "Please enter an access token",
                    footer: "IDEKube Container Environment",
                },
                zh: {
                    title: "需要访问令牌",
                    description: "此容器环境需要访问令牌才能使用。请输入您的访问令牌以继续。",
                    placeholder: "请输入访问令牌",
                    submit: "验证",
                    error: "请输入访问令牌",
                    footer: "IDEKube 容器环境",
                },
            };

            // Language management
            const langToggle = document.getElementById("langToggle");
            let currentLang = localStorage.getItem("language") || "zh";

            function setLanguage(lang) {
                currentLang = lang;
                localStorage.setItem("language", lang);
                langToggle.textContent = lang === "zh" ? "EN" : "中";

                document.querySelectorAll("[data-i18n]").forEach((el) => {
                    const key = el.getAttribute("data-i18n");
                    if (translations[lang][key]) {
                        el.textContent = translations[lang][key];
                    }
                });
                document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
                    const key = el.getAttribute("data-i18n-placeholder");
                    if (translations[lang][key]) {
                        el.placeholder = translations[lang][key];
                    }
                });
            }

            setLanguage(currentLang);

            langToggle.addEventListener("click", () => {
                setLanguage(currentLang === "zh" ? "en" : "zh");
            });

            // Theme management
            const themeToggle = document.getElementById("themeToggle");
            const html = document.documentElement;
            const savedTheme = localStorage.getItem("theme");
            const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const initialTheme = savedTheme || (systemPrefersDark ? "dark" : "light");

            function setTheme(theme) {
                html.setAttribute("data-theme", theme);
                themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
                localStorage.setItem("theme", theme);
            }

            setTheme(initialTheme);

            themeToggle.addEventListener("click", () => {
                const current = html.getAttribute("data-theme");
                setTheme(current === "dark" ? "light" : "dark");
            });

            // Form submission
            const form = document.getElementById("tokenForm");
            const input = document.getElementById("tokenInput");
            const errorMsg = document.getElementById("errorMessage");

            form.addEventListener("submit", (e) => {
                e.preventDefault();
                const token = input.value.trim();
                if (!token) {
                    errorMsg.style.display = "block";
                    return;
                }
                errorMsg.style.display = "none";
                const url = new URL(window.location.href);
                url.searchParams.set("idekube-container-access-token", token);
                window.location.href = url.toString();
            });

            input.addEventListener("input", () => {
                errorMsg.style.display = "none";
            });
        </script>
    </body>
</html>
