name: Docker Build and Publish with Buildx (Ascend)

on:
    workflow_dispatch:
    release:
        types: [published]

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Build frontend
              run: make frontend

            - name: Upload frontend dist
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-dist
                  path: frontend/dist/

    publish-base:
        runs-on: ubuntu-latest
        needs: frontend
        strategy:
            matrix:
                branch: [
                    "featured/base",
                    "jupyter/base",
                ]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download frontend dist
              uses: actions/download-artifact@v4
              with:
                  name: frontend-dist
                  path: frontend/dist/

            - name: Set build type to Ascend
              run: |
                  make set_type TYPE=ascend

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Install vcs
              run: |
                sudo apt-get install -y python3-pip && pip3 install vcstool

            - name: Publish ${{ matrix.branch }}
              run: |
                  export BRANCH=${{ matrix.branch }} && make publishx
              continue-on-error: true

    publish-extras:
        runs-on: ubuntu-latest
        needs: publish-base
        strategy:
            matrix:
                branch: [
                    "featured/speit-ai",
                    "jupyter/speit-ai"
                ]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download frontend dist
              uses: actions/download-artifact@v4
              with:
                  name: frontend-dist
                  path: frontend/dist/

            - name: Set build type to Ascend
              run: |
                  make set_type TYPE=ascend

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Install vcs
              run: |
                sudo apt-get install -y python3-pip && pip3 install vcstool

            - name: Publish ${{ matrix.branch }}
              run: |
                  export BRANCH=${{ matrix.branch }} && make publishx
              continue-on-error: true
