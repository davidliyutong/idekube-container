name: Publish QEMU Images

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-qemu:
    runs-on: ubuntu-latest
    env:
      # Opt into Node.js 24 for JavaScript actions (e.g. actions/upload-artifact@v5),
      # which silences the Node 20 deprecation warning ahead of the 2026-06-02 forced switch.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-system-aarch64 \
            qemu-utils \
            cloud-image-utils \
            ansible \
            sshpass \
            rsync

      - name: Cache QEMU files
        uses: actions/cache@v5
        with:
          path: |
            .cache/qemu_files
            .cache/qemu_images
          key: qemu-cache-${{ runner.os }}-${{ hashFiles('scripts/shell/prepare_qemu_files.sh', 'scripts/shell/prepare_qemu_images.sh') }}
          restore-keys: |
            qemu-cache-${{ runner.os }}-

      - name: Build and publish all QEMU images
        run: python3 build.py qemu-publish-all

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: qemu-logs
          path: /tmp/qemu-*.log
          if-no-files-found: ignore
