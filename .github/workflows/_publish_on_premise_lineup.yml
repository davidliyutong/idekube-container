name: _Publish On-Premise Lineup (reusable)

# Same shape as _publish_lineup.yml (matrix → tier0/1/2 publish via buildx),
# but runs on self-hosted runners. The buildx builder on the self-hosted
# runner is expected to have native nodes for each target arch; otherwise it
# falls back to QEMU emulation (same as ubuntu-latest).

on:
  workflow_call:
    inputs:
      lineup:
        required: true
        type: string
        description: "Lineup to build (base, ascend)"
      release:
        required: false
        type: boolean
        default: false
        description: "Also push <branch>-latest[-postfix] alongside the versioned tag"

jobs:
  matrix:
    runs-on: [self-hosted]
    outputs:
      tier0: ${{ steps.gen.outputs.tier0 }}
      tier1: ${{ steps.gen.outputs.tier1 }}
      tier2: ${{ steps.gen.outputs.tier2 }}
      tier3: ${{ steps.gen.outputs.tier3 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate build matrix
        id: gen
        run: |
          MATRIX=$(python3 build.py ci-matrix --lineup=${{ inputs.lineup }})
          echo "tier0=$(echo "$MATRIX" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin).get("tier0",[])))')" >> "$GITHUB_OUTPUT"
          echo "tier1=$(echo "$MATRIX" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin).get("tier1",[])))')" >> "$GITHUB_OUTPUT"
          echo "tier2=$(echo "$MATRIX" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin).get("tier2",[])))')" >> "$GITHUB_OUTPUT"
          echo "tier3=$(echo "$MATRIX" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin).get("tier3",[])))')" >> "$GITHUB_OUTPUT"

  publish-tier0:
    runs-on: [self-hosted]
    needs: matrix
    if: ${{ needs.matrix.outputs.tier0 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.matrix.outputs.tier0) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish ${{ matrix.branch }}
        run: |
          python3 build.py publishx ${{ matrix.branch }} --lineup=${{ inputs.lineup }} \
            ${{ inputs.release && '--release' || '' }}

  publish-tier1:
    runs-on: [self-hosted]
    needs: [matrix, publish-tier0]
    # Run even if a sibling in tier0 failed — fail-fast is off within a tier
    # and a missing base image will fail tier1 naturally, surfacing the real
    # error instead of the whole workflow passing green.
    if: ${{ always() && needs.matrix.outputs.tier1 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.matrix.outputs.tier1) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish ${{ matrix.branch }}
        run: |
          python3 build.py publishx ${{ matrix.branch }} --lineup=${{ inputs.lineup }} \
            ${{ inputs.release && '--release' || '' }}

  publish-tier2:
    runs-on: [self-hosted]
    needs: [matrix, publish-tier1]
    if: ${{ always() && needs.matrix.outputs.tier2 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.matrix.outputs.tier2) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish ${{ matrix.branch }}
        run: |
          python3 build.py publishx ${{ matrix.branch }} --lineup=${{ inputs.lineup }} \
            ${{ inputs.release && '--release' || '' }}

  publish-tier3:
    runs-on: [self-hosted]
    needs: [matrix, publish-tier2]
    if: ${{ always() && needs.matrix.outputs.tier3 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.matrix.outputs.tier3) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish ${{ matrix.branch }}
        run: |
          python3 build.py publishx ${{ matrix.branch }} --lineup=${{ inputs.lineup }} \
            ${{ inputs.release && '--release' || '' }}
