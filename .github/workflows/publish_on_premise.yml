name: Publish Images (On-Premise)

# Mirrors publish.yml end-to-end: same triggers, inputs, single-image mode, and
# full-lineup dispatch via a reusable sub-workflow. The only difference is
# runs-on — jobs target `[self-hosted]` runners instead of `ubuntu-latest`.
# Both flavors use buildx (publishx) so the published tag shape is identical.

on:
  workflow_dispatch:
    inputs:
      lineup:
        description: "Lineup to build"
        type: choice
        options:
          - base
          - ascend
          - all
        default: base
      branch:
        description: "Single image to build (e.g. featured/base). Leave empty to build all."
        type: string
        default: ""
  release:
    types: [published]

jobs:
  frontend:
    runs-on: [self-hosted]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build frontend
        run: make frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/

  # --- Single-image mode: build just one flavor ---
  publish-single:
    runs-on: [self-hosted]
    needs: frontend
    if: ${{ inputs.branch != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish ${{ inputs.branch }} (${{ inputs.lineup }})
        run: |
          python3 build.py publishx ${{ inputs.branch }} --lineup=${{ inputs.lineup }} \
            ${{ github.event_name == 'release' && '--release' || '' }}

  # --- Full-lineup mode: reuse sub-workflow, one invocation per lineup ---
  publish-base:
    needs: frontend
    if: ${{ inputs.branch == '' && (github.event_name == 'release' || inputs.lineup == 'base' || inputs.lineup == 'all') }}
    uses: ./.github/workflows/_publish_on_premise_lineup.yml
    with:
      lineup: base
      release: ${{ github.event_name == 'release' }}
    secrets: inherit

  publish-ascend:
    needs: frontend
    if: ${{ inputs.branch == '' && (github.event_name == 'release' || inputs.lineup == 'ascend' || inputs.lineup == 'all') }}
    uses: ./.github/workflows/_publish_on_premise_lineup.yml
    with:
      lineup: ascend
      release: ${{ github.event_name == 'release' }}
    secrets: inherit
