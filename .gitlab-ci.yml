build-and-publish:
  stage: build
  tags:
    - shell
    - docker
    - rocky
  variables:
    AUTHOR: $CI_AUTHOR
    USE_APT_MIRROR: true
    APT_MIRROR: $CI_APT_MIRROR
    REGISTRY: $CI_DOCKER_REGISTRY
  before_script:
    - sudo dnf install -y python3-vcstool nodejs npm
    - echo $CI_DOCKER_PASSWORD | docker login $CI_DOCKER_REGISTRY --username $CI_DOCKER_USERNAME --password-stdin
    - docker info
  script:
    - make frontend
    - python3 build.py publishx-all --lineup=base --parallel=4
  only:
    - tags
    - triggers
    - branches
  when: manual
